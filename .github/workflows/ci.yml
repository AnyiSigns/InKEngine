name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── 引擎侧三关 ──

  arch-gate:
    name: 架构门禁（机制层语义中立）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e "ink_engine[test]"
      - run: python -m pytest ink_engine/tests/test_architecture_gate.py -v

  engine-full:
    name: 引擎全量（跳过 live）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e "ink_engine[test,sqlite,llm,mcp]"
      - run: python -m pytest ink_engine/tests --ignore=ink_engine/tests/live -q

  ruff:
    name: ruff 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check ink_engine

  # ── 种子侧门禁（命令 = manifest.json self_check 单一事实源）──
  # schema 数据校验与接线 e2e 门禁随 Rust 自检编排落地后在此恢复；
  # 当前保留 cargo 执行件与 frontend 类型检查两道可独立执行的出厂门禁。

  seed-cargo:
    name: 种子 cargo test（执行件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: inkling/exec
      - run: cargo test --manifest-path inkling/exec/Cargo.toml

  seed-frontend:
    name: 种子 frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: inkling/frontend/package-lock.json
      - run: npm ci --prefix inkling/frontend
      - run: npm --prefix inkling/frontend run typecheck
