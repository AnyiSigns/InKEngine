<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InKling</title>
    <script>
      // 首屏前解析主题偏好：读持久化档位（light/dark/system），
      // 在 CSS 应用前预挂 data-theme，避免闪屏（system 档清空属性交回媒体查询）。
      (function () {
        try {
          var stored = localStorage.getItem("inkling.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
