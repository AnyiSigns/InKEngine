[package]
name = "inkling_shell"
version = "0.1.0"
description = "InKling 桌面壳（宿主件）：托盘/系统通知/文件挂载授权 + process_exec 执行器注册 + 设备感知 server 挂载接线"
authors = ["InKling"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 嵌入式 Python 引擎桥（本包嵌入执行；开发构建解释器经 .cargo/config.toml 指向仓库根 .venv）
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
# Python asyncio ↔ tokio 双向桥（引擎异步 API 的跨语言执行形态）
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
# 接线层域模块共享依赖（数据映射/内容寻址/路径检索/网络策略）
# stream 特性供 http_fetch 端点响应体限长读取（S5：Content-Length 预检 + 流式截断，禁整块读入）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
url = "2"
thiserror = "1"
serde_yaml = "0.9"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
# 本地嵌入真实推理（granite-97m ONNX；ort 2.x rc 形态：默认 feature 即
# ndarray + download-binaries + std，构建期自动下载 ONNX Runtime 二进制；
# rc.10 为钉死版本——rc 序列存在 API 漂移（如 outputs 字段可见性），
# 升级需重新过编译与真实模型断言）
ort = "=2.0.0-rc.10"
# ModernBERT BPE 分词（tokenizer.json 直接载入；default-features=off 且
# 不带 esaxx_fast：esaxx-rs 仅 unigram 训练器用、推理不触碰，且其强制
# 静态 CRT 与 ort 预编译库（动态 CRT）链接冲突——本壳只需推理）
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
flate2 = "1.1.9"

# 生产形态开关：开启后加载 frontend/dist（内嵌资产），不依赖 dev server。
# 缺省（不带该 feature 构建）= dev 形态连 devUrl——Tauri 的 dev 判定
# 即 `dev = !custom-protocol`，因此生产构建必须显式携带此 feature。
[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "inkling_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
