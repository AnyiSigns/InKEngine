[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textforge-engine-core"
version = "0.1.0"
description = "InkEngine 墨引擎内核：TextForge 自研小说生成引擎（图执行/checkpoint 版本链/事件流/interrupt/补丁链）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # 引擎内核零业务依赖：仅标准库 + 可选存储后端驱动
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19"]
postgres = ["asyncpg>=0.29"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
]

[tool.setuptools.packages.find]
include = ["engine_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# 性能门禁/精确基准默认不跑（环境抖动容忍度差），CI 单独 pytest -m benchmark
addopts = ["-m", "not benchmark"]
markers = [
    "benchmark: 性能基准测试（E1 验收指标）",
    "postgres: 需要真实 Postgres 的集成测试，无环境时跳过",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 中文项目必需：全角字符（括号/逗号）是正常书写，不视为歧义字符
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
