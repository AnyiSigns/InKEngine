[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ink_engine"
version = "0.1.0"
description = "InkEngine 墨引擎：通用 agent 机制引擎内核（图执行/checkpoint 版本链/事件流/interrupt/补丁链/运行时重规划/决策点推演/知识集孵化/输入调配管线）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # 引擎内核零业务依赖：仅标准库 + 可选存储后端驱动
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19"]
postgres = ["asyncpg>=0.29"]
# LLM 层（AsyncLLM/厂商适配/SSE 流式）的 HTTP 传输依赖；核心包保持零运行时依赖
llm = ["httpx>=0.27"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["ink_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# 性能门禁/精确基准默认不跑（环境抖动容忍度差），CI 单独 pytest -m benchmark；
# 真实厂商冒烟（-m live）需 INKENGINE_LIVE_* 环境变量，默认不跑
addopts = ["-m", "not benchmark and not live"]
markers = [
    "benchmark: 性能基准测试（基准指标）",
    "postgres: 需要真实 Postgres 的集成测试，无环境时跳过",
    "live: 真实厂商冒烟测试（流式/tool/reasoning），需 INKENGINE_LIVE_BASE_URL/API_KEY/MODEL 环境变量",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 中文项目必需：全角字符（括号/逗号）是正常书写，不视为歧义字符
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
